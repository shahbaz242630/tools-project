version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Next 16.3.1 bumped its own `@swc/helpers` dependency (its changelog says
      # so), and `@swc/helpers` exposes `./esm/*` as a **wildcard** export --
      # which static file tracing cannot enumerate. So `output: 'standalone'`
      # emits the package without its `esm/` directory, and next's own
      # `require-hook.js` dies at boot looking for
      # `@swc/helpers/esm/_interop_require_default.js`. Every request path is
      # affected: the web container never becomes healthy.
      #
      # `Deploy rehearsal` caught it on #140 -- "web did not become healthy
      # within 180s" -- which is exactly the job's purpose, and is why that
      # check is required rather than advisory. 16.3.0 works and is what staging
      # runs. 16.3.1 carries no fix we need (turbopack, next/image, cache and
      # router backports).
      #
      # Pinned to the one broken version, so **16.3.2 comes through normally**.
      # Note this entry only stops the pull request: what actually holds the
      # version is the lockfile plus `--frozen-lockfile` in both Dockerfiles,
      # because the manifest range is `^16.3.0` and permits 16.3.1.
      - dependency-name: next
        versions: ['16.3.1']
    # Group the noisy low-risk updates so review effort goes to the ones that
    # can actually break something.
    groups:
      dev-tooling:
        patterns:
          - '@types/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'vitest'
          - '@vitest/*'
          - 'globals'
        update-types:
          - minor
          - patch
      # NestJS ships its packages in lockstep and they must be version-matched at
      # runtime, so they are grouped **including minors** -- which no other group
      # here does.
      #
      # This exists because session 49 watched it fail. Dependabot raised
      # 11.1.28 -> 11.2.1 as **four separate pull requests** (#148-#151), because
      # both groups below cover patches only and this was a minor. `@nestjs/core`
      # alone then failed three checks: 11.2.1's `router-execution-context`
      # requires `@nestjs/common/decorators/http/sse-signal.decorator`, which
      # exists only in `common@11.2.1`, so the lockfile's
      # `core@11.2.1_common@11.1.28` could not even boot the application.
      #
      # Nothing was wrong with the release -- taken together the four are clean.
      # What was wrong was shipping a framework half-upgraded, and a group is the
      # only thing that prevents it, because merging four PRs in the right order
      # is a habit rather than a control.
      nestjs:
        patterns:
          - '@nestjs/*'
        update-types:
          - minor
          - patch
      production-patches:
        patterns:
          - '*'
        exclude-patterns:
          # Grouped above, including minors.
          - '@nestjs/*'
          - '@types/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'vitest'
          - '@vitest/*'
          - 'globals'
        update-types:
          - patch
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Group every action update including majors into one pull request. An
    # action's failure mode is loud and immediate — CI either runs or it does
    # not — so they are safe to review together. Five separate pull requests for
    # five routine bumps is noise that trains you to stop reading them.
    #
    # **Actions are pinned by commit SHA, not by tag, from 19 August 2026.** A
    # tag is a mutable pointer: whoever can push to the action's repository can
    # repoint `@v7` at new code, and it runs on the next workflow — including in
    # `release.yml`, the one job holding `packages: write`. That is not
    # hypothetical; it is how the March 2025 `tj-actions/changed-files` compromise
    # reached thousands of repositories, which had pinned exactly as we had.
    #
    # **This entry is what makes the pin affordable.** A SHA never floats, so
    # without something raising the update, pinning trades a supply-chain risk
    # for an unpatched-action risk. Dependabot rewrites the SHA *and* the `# v7`
    # comment beside it, so the tag stays readable and the bump stays reviewable.
    # Do not "tidy" the pins back to tags to reduce diff noise.
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(infra)'
