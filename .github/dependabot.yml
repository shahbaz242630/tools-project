version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Group the noisy low-risk updates so review effort goes to the ones that
    # can actually break something.
    groups:
      dev-tooling:
        patterns:
          - '@types/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'vitest'
          - '@vitest/*'
          - 'globals'
        update-types:
          - minor
          - patch
      production-patches:
        patterns:
          - '*'
        exclude-patterns:
          - '@types/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'vitest'
          - '@vitest/*'
          - 'globals'
        update-types:
          - patch
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Group every action update including majors into one pull request. Actions
    # are pinned by major tag and their failure mode is loud and immediate — CI
    # either runs or it does not — so they are safe to review together. Five
    # separate pull requests for five routine tag bumps is noise that trains
    # you to stop reading them.
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(infra)'
