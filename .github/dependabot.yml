version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Next 16.3.1 bumped its own `@swc/helpers` dependency (its changelog says
      # so), and `@swc/helpers` exposes `./esm/*` as a **wildcard** export --
      # which static file tracing cannot enumerate. So `output: 'standalone'`
      # emits the package without its `esm/` directory, and next's own
      # `require-hook.js` dies at boot looking for
      # `@swc/helpers/esm/_interop_require_default.js`. Every request path is
      # affected: the web container never becomes healthy.
      #
      # `Deploy rehearsal` caught it on #140 -- "web did not become healthy
      # within 180s" -- which is exactly the job's purpose, and is why that
      # check is required rather than advisory. 16.3.0 works and is what staging
      # runs. 16.3.1 carries no fix we need (turbopack, next/image, cache and
      # router backports).
      #
      # Pinned to the one broken version, so **16.3.2 comes through normally**.
      # Note this entry only stops the pull request: what actually holds the
      # version is the lockfile plus `--frozen-lockfile` in both Dockerfiles,
      # because the manifest range is `^16.3.0` and permits 16.3.1.
      - dependency-name: next
        versions: ['16.3.1']
    # Group the noisy low-risk updates so review effort goes to the ones that
    # can actually break something.
    groups:
      dev-tooling:
        patterns:
          - '@types/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'vitest'
          - '@vitest/*'
          - 'globals'
        update-types:
          - minor
          - patch
      production-patches:
        patterns:
          - '*'
        exclude-patterns:
          - '@types/*'
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'vitest'
          - '@vitest/*'
          - 'globals'
        update-types:
          - patch
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Group every action update including majors into one pull request. Actions
    # are pinned by major tag and their failure mode is loud and immediate — CI
    # either runs or it does not — so they are safe to review together. Five
    # separate pull requests for five routine tag bumps is noise that trains
    # you to stop reading them.
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(infra)'
