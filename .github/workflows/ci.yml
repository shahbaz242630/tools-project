name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs opt in to more where they need it.
permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Formatting first: fastest signal, cheapest to fix.
      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Typechecks tests as well as source — tsconfig.json includes them.
      - name: Typecheck
        run: pnpm typecheck

      # Project invariants (see CLAUDE.md and adr/). The pre-commit hook runs
      # these too, but a hook is advisory — `--no-verify` skips it, and a fresh
      # clone that never ran `pnpm install` has no hooks at all. This is the
      # layer that actually enforces them.
      - name: Check invariants
        run: pnpm invariants

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Thresholds live in vitest.config.ts, so a coverage regression fails the
      # job rather than being reported and quietly ignored.
      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages
        run: pnpm build

      # The unit suite resolves @platform/* to TypeScript source, so it never
      # loads the built output. That is how every package came to declare a
      # .ts entry point that no running process could load, while CI stayed
      # green. This imports each built package in a real Node module graph.
      - name: Verify packages load at runtime
        run: pnpm verify:runtime

  database:
    name: Database invariants
    runs-on: ubuntu-latest
    # Proves the runner can host our actual database requirements. Without
    # this, a missing extension surfaces only when the first migration runs,
    # by which point the failure is a long way from its cause.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: rental
          POSTGRES_DB: rental_test
          # No password: this container is ephemeral and reachable only from
          # within its own job. Carrying a literal credential here would add a
          # hardcoded secret to the repository for no security benefit.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental -d rental_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Install clients
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools

      - name: Create and verify extensions
        run: |
          set -euo pipefail
          psql() { command psql -h localhost -U rental -d rental_test -v ON_ERROR_STOP=1 "$@"; }

          for ext in postgis btree_gist pg_trgm citext; do
            psql -q -c "CREATE EXTENSION IF NOT EXISTS $ext;"
            version=$(psql -tAc "SELECT extversion FROM pg_extension WHERE extname='$ext'")
            if [ -z "$version" ]; then
              echo "::error::extension $ext is missing"
              exit 1
            fi
            echo "$ext $version"
          done

      # BRD §8.5.1. The double-booking guarantee rests entirely on this
      # constraint, so assert the database enforces it rather than trusting
      # that btree_gist being installed is sufficient.
      - name: Assert booking overlap constraint rejects overlaps
        run: |
          set -euo pipefail
          psql() { command psql -h localhost -U rental -d rental_test -v ON_ERROR_STOP=1 "$@"; }

          psql -q -c "CREATE TABLE booking_overlap_check (
                        id int PRIMARY KEY,
                        listing_id int NOT NULL,
                        period tstzrange NOT NULL,
                        EXCLUDE USING gist (listing_id WITH =, period WITH &&)
                      );"
          psql -q -c "INSERT INTO booking_overlap_check VALUES (1, 1, tstzrange('2026-08-01','2026-08-05'));"

          if psql -q -c "INSERT INTO booking_overlap_check VALUES (2, 1, tstzrange('2026-08-03','2026-08-07'));" 2>/dev/null; then
            echo "::error::an overlapping booking was accepted — double-booking prevention is broken"
            exit 1
          fi
          echo "overlapping period correctly rejected"

          psql -q -c "INSERT INTO booking_overlap_check VALUES (3, 2, tstzrange('2026-08-03','2026-08-07'));"
          echo "same period on a different listing correctly allowed"

      - name: Assert Redis rejects eviction
        run: |
          set -euo pipefail
          policy=$(redis-cli -h localhost config get maxmemory-policy | tail -n 1)
          echo "maxmemory-policy: $policy"
          # BullMQ requires noeviction. A changed base image must not silently
          # reintroduce the possibility of losing queued jobs.
          if [ "$policy" != "noeviction" ]; then
            echo "::error::Redis maxmemory-policy is $policy, expected noeviction"
            exit 1
          fi

  container:
    name: Container image
    runs-on: ubuntu-latest
    # `pnpm build` proving the TypeScript compiles says nothing about whether
    # the artefact we deploy actually starts. This builds the real image and
    # boots it, which is the same class of gap ADR 0010 was written about.
    steps:
      - uses: actions/checkout@v7

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t rental-api:ci .

      - name: Build the worker image
        run: docker build -f apps/worker/Dockerfile -t rental-worker:ci .

      - name: Boot it and check liveness
        run: |
          set -euo pipefail

          # Liveness deliberately depends on nothing, so this proves the
          # process starts without a database standing by. Readiness against
          # real dependencies is covered by the integration suite.
          # The Clerk values are placeholders. No token is verified here and no
          # Clerk instance is contacted -- the API validates its whole
          # environment at startup, so it will not boot without them, which is
          # the behaviour this step exists to prove works. The public key has to
          # be PEM-shaped because the schema checks that; it is written on one
          # line with no `\n` escapes because nothing here needs to parse it.
          # --stop-timeout mirrors stop_grace_period in
          # infra/compose/docker-compose.app.yml, so this asserts against the
          # grace period the API actually gets when deployed rather than
          # Docker's 10s default, which is a dead heat with SHUTDOWN_TIMEOUT_MS.
          # POSTGRES_SSLMODE is required because the image sets
          # NODE_ENV=production and @platform/config refuses to start without it
          # there (ADR 0038). `disable` is honest: this container reaches no
          # database at all, which is the point of the liveness check.
          docker run -d --name api-ci -p 3000:3000 --stop-timeout 15 \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            -e POSTGRES_SSLMODE=disable \
            -e 'CLERK_JWT_PUBLIC_KEY=-----BEGIN PUBLIC KEY-----ci-only-not-a-real-key-----END PUBLIC KEY-----' \
            -e CLERK_AUTHORIZED_PARTIES=http://localhost:3000 \
            -e PERSONAL_DATA_ENCRYPTION_KEY="$(head -c 32 /dev/zero | base64)" \
            rental-api:ci

          # Generous: a cold Node start on a loaded runner has been seen to take
          # ten seconds. A required check that flakes gets ignored, which is
          # worse than one that is occasionally slow.
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health > /tmp/health.json; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::the image never became live"
              docker logs api-ci
              exit 1
            fi
            sleep 1
          done

          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Check it shuts down gracefully
        run: |
          set -euo pipefail

          # A deploy sends SIGTERM. If it is not handled, the container lingers
          # for the full stop timeout and is then SIGKILLed mid-request, which
          # looks like random 502s during every release rather than like a bug.
          start=$(date +%s)
          docker stop api-ci > /dev/null
          elapsed=$(( $(date +%s) - start ))

          code=$(docker inspect api-ci --format '{{.State.ExitCode}}')
          echo "stopped in ${elapsed}s with exit code ${code}"
          docker logs api-ci 2>&1 | tail -n 3

          if [ "$code" != "0" ]; then
            echo "::error::expected a clean exit, got ${code} — SIGTERM was not handled"
            exit 1
          fi
          if [ "$elapsed" -ge 10 ]; then
            echo "::error::took ${elapsed}s, so it was killed rather than draining"
            exit 1
          fi

      - name: Check the worker starts and drains without Redis
        run: |
          set -euo pipefail

          # Deliberately no Redis. A worker that only shuts down cleanly while
          # its broker is reachable would hang during exactly the incident that
          # makes someone want to redeploy -- the failure the API shipped with
          # and CI caught.
          # --stop-timeout mirrors stop_grace_period in
          # infra/compose/docker-compose.app.yml. Without it `docker stop` uses
          # Docker's 10s default, so this step would assert against a grace
          # period we do not deploy with -- the same mismatch that let the
          # worker's 30s force-exit sit unreachable for four sessions.
          docker run -d --name worker-ci --stop-timeout 45 \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            -e POSTGRES_SSLMODE=disable \
            rental-worker:ci

          sleep 5
          if [ "$(docker inspect worker-ci --format '{{.State.Running}}')" != "true" ]; then
            echo "::error::the worker exited instead of retrying its connection"
            docker logs worker-ci
            exit 1
          fi

          start=$(date +%s)
          docker stop worker-ci > /dev/null
          elapsed=$(( $(date +%s) - start ))
          code=$(docker inspect worker-ci --format '{{.State.ExitCode}}')

          echo "stopped in ${elapsed}s with exit code ${code}"
          docker logs worker-ci 2>&1 | tail -n 3

          # Two distinct failures, deliberately reported differently. A non-zero
          # code means the grace period ran out and Docker SIGKILLed it. A clean
          # exit that took most of the window means the process decided its own
          # exit but something it waited on is wedged -- bullmq 6's close(),
          # which never settles without Redis, drains in 25s where 5 takes about
          # one. Both are worth failing on; conflating them hides which happened.
          if [ "$code" != "0" ]; then
            echo "::error::expected a clean exit, got ${code} — killed rather than draining"
            exit 1
          fi
          if [ "$elapsed" -ge 10 ]; then
            echo "::error::drained cleanly but took ${elapsed}s; a healthy worker stops in about a second"
            exit 1
          fi

  deploy-rehearsal:
    name: Deploy rehearsal
    runs-on: ubuntu-latest
    # Runs the real deployment stack and the real deploy script, with the same
    # compose files a VPS will use. The Phase 0 exit gate requires rollback and
    # log retrieval to be demonstrated; this is where that is demonstrated
    # mechanically, on every pull request, rather than once by hand.
    #
    # It cannot prove the environment — there is no staging box yet — but it
    # proves the mechanism, which is the part that rots silently.
    steps:
      - uses: actions/checkout@v7

      - name: Build both images under two release tags
        run: |
          set -euo pipefail

          # Valid-shaped commit SHAs. The deploy script refuses anything that is
          # not 40 hex characters, and that rule is under test here too — using
          # a convenience tag would exercise a code path production never takes.
          echo "TAG_A=$(printf 'a%.0s' {1..40})" >> "$GITHUB_ENV"
          echo "TAG_B=$(printf 'b%.0s' {1..40})" >> "$GITHUB_ENV"
          echo "TAG_BROKEN=$(printf 'c%.0s' {1..40})" >> "$GITHUB_ENV"

      - name: Build the release images
        run: |
          set -euo pipefail

          # Same image under both tags. The rollback assertions compare the tag
          # the container was started from, so two identical builds would prove
          # the same thing at twice the cost.
          docker build -f apps/api/Dockerfile \
            -t "local/rental/api:${TAG_A}" -t "local/rental/api:${TAG_B}" .
          docker build -f apps/worker/Dockerfile \
            -t "local/rental/worker:${TAG_A}" -t "local/rental/worker:${TAG_B}" .
          docker build -f apps/web/Dockerfile \
            -t "local/rental/web:${TAG_A}" -t "local/rental/web:${TAG_B}" .
          docker build -f packages/database/Dockerfile \
            -t "local/rental/migrations:${TAG_A}" \
            -t "local/rental/migrations:${TAG_B}" .

      - name: Build a release that starts but never serves
        run: |
          set -euo pipefail

          # The realistic bad deploy: the container runs, so Docker is satisfied,
          # and nothing ever answers on the port. A container that exits would be
          # caught by compose alone and prove much less.
          mkdir -p /tmp/broken
          cat > /tmp/broken/Dockerfile <<'DOCKERFILE'
          FROM node:24-alpine
          CMD ["node","-e","console.error('FATAL: refusing to serve'); setInterval(()=>{},1000)"]
          DOCKERFILE

          docker build -t "local/rental/api:${TAG_BROKEN}" \
                       -t "local/rental/worker:${TAG_BROKEN}" \
                       -t "local/rental/web:${TAG_BROKEN}" /tmp/broken

          # The broken release still needs *working* migrations at its tag: the
          # deploy must fail at the readiness check, which is what this tests,
          # rather than earlier at the migration step for an unrelated reason.
          docker tag "local/rental/migrations:${TAG_A}" \
                     "local/rental/migrations:${TAG_BROKEN}"

      - name: Provision the box
        run: |
          set -euo pipefail

          # The same steps infra/compose/README.md gives an operator. If they
          # drift, this job fails and the runbook gets fixed.
          docker network create rental-edge

          echo "RELEASE_ROOT=${RUNNER_TEMP}/release-root" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/release-root"

          # The Clerk values are rehearsal-only placeholders. This job proves the
          # stack starts, is wired together and can be rolled back -- it never
          # signs anyone in, so no real instance is involved and no Clerk secret
          # is needed in CI.
          #
          # The public key is written on one line with no `\n` escapes, which is
          # not what a real one looks like. That is deliberate: sed interprets
          # `\n` in a replacement as an actual newline and would split the value
          # across two lines, silently corrupting the env file. The startup
          # check only validates the `-----BEGIN PUBLIC KEY-----` prefix, and
          # the unescaping is covered by unit tests in @platform/config.
          #
          # The encryption key is fake but has to be *well formed* -- base64 of
          # exactly 32 bytes -- because the startup schema checks the length. A
          # placeholder like `rehearsal-only` is rejected and the API never
          # boots, which is the same trap the Clerk publishable key set: a
          # structurally meaningful value cannot be faked with arbitrary text.
          # This one decodes to `rehearsal-only-not-a-real-key!!!`.
          # POSTGRES_SSLMODE is overridden because the rehearsal runs the
          # sidecar Postgres in docker-compose.app.yml, which speaks no TLS.
          # The example file carries `verify-full` because that is right for the
          # managed database a real environment points at (ADR 0037), and this
          # is the same override the password and every Clerk value already get.
          # `disable` is a value somebody has to type -- @platform/config
          # refuses to start with it unset under NODE_ENV=production -- so the
          # rehearsal proves that requirement is satisfiable rather than routing
          # around it.
          sed -e 's|^IMAGE_REPOSITORY=.*|IMAGE_REPOSITORY=local/rental|' \
              -e 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=rehearsal-only|' \
              -e 's|^POSTGRES_SSLMODE=.*|POSTGRES_SSLMODE=disable|' \
              -e 's|^NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=.*|NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_cmVoZWFyc2FsLmNsZXJrLmFjY291bnRzLmRldiQ|' \
              -e 's|^CLERK_SECRET_KEY=.*|CLERK_SECRET_KEY=sk_test_rehearsal|' \
              -e 's|^CLERK_WEBHOOK_SIGNING_SECRET=.*|CLERK_WEBHOOK_SIGNING_SECRET=whsec_rehearsal|' \
              -e 's|^CLERK_JWT_PUBLIC_KEY=.*|CLERK_JWT_PUBLIC_KEY=-----BEGIN PUBLIC KEY-----rehearsal-only-not-a-real-key-----END PUBLIC KEY-----|' \
              -e 's|^CLERK_AUTHORIZED_PARTIES=.*|CLERK_AUTHORIZED_PARTIES=http://localhost|' \
              -e "s|^PERSONAL_DATA_ENCRYPTION_KEY=.*|PERSONAL_DATA_ENCRYPTION_KEY=$(head -c 32 /dev/zero | base64)|" \
              infra/compose/app.env.example > "${RUNNER_TEMP}/release-root/staging.env"

          sed -e 's|^ACME_EMAIL=.*|ACME_EMAIL=rehearsal@example.invalid|' \
              -e 's|^PRODUCTION_SITE_ADDRESS=.*|PRODUCTION_SITE_ADDRESS=http://production.localhost|' \
              -e 's|^STAGING_SITE_ADDRESS=.*|STAGING_SITE_ADDRESS=http://localhost|' \
              infra/compose/ingress.env.example > "${RUNNER_TEMP}/release-root/ingress.env"

      - name: Both compose files are valid
        run: |
          set -euo pipefail
          APP_ENV=staging IMAGE_TAG="${TAG_A}" docker compose \
            --env-file "${RELEASE_ROOT}/staging.env" \
            -f infra/compose/docker-compose.app.yml config --quiet
          docker compose \
            --env-file "${RELEASE_ROOT}/ingress.env" \
            -f infra/compose/docker-compose.ingress.yml config --quiet

      - name: Deploy
        run: node scripts/deploy.mjs --env staging --tag "${TAG_A}" --timeout 180

      - name: Migrations ran, and the schema is really there
        run: |
          set -euo pipefail

          # `deploy.mjs` reports success only if `migrate deploy` exited 0, but
          # a migration tool that prints an error and exits 0 is a real failure
          # mode we have already hit once. Assert the schema, not the exit code.
          tables=$(docker exec rental-staging-postgres                      psql -U rental -d rental -tAc                      "select tablename from pg_tables where schemaname='public' order by 1;")
          echo "$tables"

          for table in users _prisma_migrations; do
            if ! echo "$tables" | grep -qx "$table"; then
              echo "::error::table ${table} is missing — migrations did not apply"
              exit 1
            fi
          done

          # citext is created by the migration, not inherited from the local
          # init SQL, so a fresh environment builds the same schema.
          if [ "$(docker exec rental-staging-postgres psql -U rental -d rental -tAc                    "select extname from pg_extension where extname='citext';")" != "citext" ]; then
            echo "::error::the citext extension is missing"
            exit 1
          fi

          # It ran to completion and left nothing behind.
          if docker ps --format '{{.Names}}' | grep -q 'migrations'; then
            echo "::error::the migrations container is still running"
            exit 1
          fi
          echo "schema applied by the migrations image, container exited"

      - name: The deployed images carry no credentials
        run: |
          set -euo pipefail

          # .dockerignore is what keeps .env out of every layer, and a layer is
          # readable by anyone who can pull the image. Asserted rather than
          # assumed, because deleting a file in a later layer does not remove it
          # from the earlier one.
          for app in api worker web; do
            if docker run --rm --entrypoint sh "local/rental/${app}:${TAG_A}" \
                 -c 'test -e /app/.env'; then
              echo "::error::${app} image contains /app/.env"
              exit 1
            fi

            baked=$(docker inspect "local/rental/${app}:${TAG_A}" \
                    --format '{{json .Config.Env}}')
            if echo "$baked" | grep -Eiq 'password|secret|token'; then
              echo "::error::${app} image bakes a credential into its environment: ${baked}"
              exit 1
            fi
          done

      - name: The data stores are not reachable from outside the stack
        run: |
          set -euo pipefail

          # The single most expensive mistake available here. An exposed Redis
          # or Postgres on a public IP is found by scanners within minutes, and
          # `ports:` is one line away from existing.
          for service in postgres redis api worker web; do
            published=$(docker port "rental-staging-${service}" 2>/dev/null || true)
            if [ -n "$published" ]; then
              echo "::error::rental-staging-${service} publishes ports: ${published}"
              exit 1
            fi
          done
          echo "no application container publishes a port"

      - name: Deploy a second release
        run: |
          set -euo pipefail
          node scripts/deploy.mjs --env staging --tag "${TAG_B}" --timeout 180

          for service in api web worker; do
            running=$(docker inspect "rental-staging-${service}" --format '{{.Config.Image}}')
            if [ "$running" != "local/rental/${service}:${TAG_B}" ]; then
              echo "::error::expected ${service} to be running ${TAG_B}, found ${running}"
              exit 1
            fi
          done

      - name: Roll back
        run: |
          set -euo pipefail
          node scripts/deploy.mjs --env staging --rollback --timeout 180

          # The assertion that matters: not that the command succeeded, but that
          # every container is genuinely running the earlier image again. A
          # rollback that moved only some of them is worse than none.
          for service in api web worker; do
            running=$(docker inspect "rental-staging-${service}" --format '{{.Config.Image}}')
            if [ "$running" != "local/rental/${service}:${TAG_A}" ]; then
              echo "::error::rollback reported success but ${service} is running ${running}"
              exit 1
            fi
          done
          echo "rolled back to ${TAG_A}"

      - name: A failed deploy reverts itself and says why
        run: |
          set -euo pipefail

          if node scripts/deploy.mjs --env staging --tag "${TAG_BROKEN}" --timeout 20; then
            echo "::error::deploying a release that never serves reported success"
            exit 1
          fi

          running=$(docker inspect rental-staging-api --format '{{.Config.Image}}')
          if [ "$running" != "local/rental/api:${TAG_A}" ]; then
            echo "::error::the bad deploy was not reverted — API is running ${running}"
            exit 1
          fi

          # The revert replaces the failed container, so its logs have to have
          # been captured before that happened or the reason is lost.
          if ! grep -q 'FATAL: refusing to serve' \
                 "${RELEASE_ROOT}/state/staging.failed.log"; then
            echo "::error::the failed release's logs were not captured before the revert"
            cat "${RELEASE_ROOT}/state/staging.failed.log" 2>&1 || true
            exit 1
          fi
          echo "reverted to ${TAG_A}, and the failure reason was preserved"

      - name: Traffic reaches the stack through the ingress
        run: |
          set -euo pipefail

          docker compose --env-file "${RELEASE_ROOT}/ingress.env" \
            -f infra/compose/docker-compose.ingress.yml up -d

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost/ > /tmp/home.html; then break; fi
            if [ "$attempt" = "30" ]; then
              echo "::error::the ingress never served the staging web app"
              docker logs rental-ingress
              exit 1
            fi
            sleep 1
          done

          # The brand name comes from packages/config. Asserting it proves the
          # page rendered from our code rather than a proxy placeholder.
          if ! grep -q 'Rental Marketplace' /tmp/home.html; then
            echo "::error::the home page did not render the brand name"
            head -c 500 /tmp/home.html
            exit 1
          fi

          # The end-to-end path that matters: browser → ingress → web → API →
          # Postgres and Redis. Rendered server-side, so a "ready" here means
          # every hop worked.
          curl -fsS http://localhost/status > /tmp/status.html
          if ! grep -q 'API: ready' /tmp/status.html; then
            echo "::error::the status page did not report the API as ready"
            head -c 1000 /tmp/status.html
            exit 1
          fi

          # The API must NOT be reachable through the ingress. It is not on the
          # edge network, and this is the assertion that keeps it that way — the
          # browser has no business calling it directly yet.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/ready)
          if [ "$status" = "200" ]; then
            echo "::error::/ready is served publicly — the API is exposed through the ingress"
            exit 1
          fi

          # Routing must discriminate by hostname. Production has no stack, so
          # a 502 here is the proof; a 200 would mean both hostnames resolve to
          # staging and a production deploy would silently serve the wrong one.
          status=$(curl -s -o /dev/null -w '%{http_code}' \
                   -H 'Host: production.localhost' http://localhost/)
          if [ "$status" != "502" ]; then
            echo "::error::production.localhost returned ${status}, expected 502 — the ingress is not routing by hostname"
            exit 1
          fi
          echo "ingress serves the staging web app, keeps the API private, and does not confuse staging with production"

      - name: Logs can be retrieved
        run: |
          set -euo pipefail

          # The other half of the exit gate. Retrieval has to produce content —
          # an empty result and a broken command look identical otherwise.
          node scripts/logs.mjs --env staging --service api --since 30m \
            --out /tmp/api.log
          if ! grep -q 'api listening' /tmp/api.log; then
            echo "::error::the API log did not contain its own startup line"
            cat /tmp/api.log
            exit 1
          fi

          node scripts/logs.mjs --env ingress --since 30m --out /tmp/ingress.log
          if ! grep -q 'handled request' /tmp/ingress.log; then
            echo "::error::the ingress access log is empty after serving requests"
            exit 1
          fi

          node scripts/logs.mjs --env staging --service web --since 30m --out /tmp/web.log
          if ! grep -qi 'ready\|started' /tmp/web.log; then
            echo "::error::the web log did not contain its own startup line"
            cat /tmp/web.log
            exit 1
          fi

          node scripts/logs.mjs --env staging --service worker --since 30m > /dev/null
          echo "web, api, worker and ingress logs all retrievable"

      # Before Tear down, deliberately. Removing the containers destroys the
      # only record of why they were unhealthy, and this job has already cost
      # one debugging session that a captured log would have ended in a minute.
      # Same lesson as the deploy script's own capture-before-revert.
      - name: Capture what failed
        if: failure()
        run: |
          for service in web api worker migrations; do
            echo "::group::${service}"
            docker logs "rental-staging-${service}" 2>&1 | tail -80 || echo "(no container)"
            echo "::endgroup::"
          done

          echo "::group::container states"
          docker ps -a --filter "name=rental-staging-" \
            --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
          echo "::endgroup::"

          # A container can be `unhealthy` for a reason its stdout never shows —
          # the probe's own output lives here and nowhere else.
          echo "::group::health probe output"
          for service in web api; do
            docker inspect "rental-staging-${service}" \
              --format '{{.Name}}: {{json .State.Health}}' 2>/dev/null || true
          done
          echo "::endgroup::"

      - name: Tear down
        if: always()
        run: |
          docker compose --env-file "${RELEASE_ROOT}/ingress.env" \
            -f infra/compose/docker-compose.ingress.yml down -v || true
          APP_ENV=staging IMAGE_TAG="${TAG_A}" docker compose \
            --env-file "${RELEASE_ROOT}/staging.env" \
            -f infra/compose/docker-compose.app.yml down -v || true

  worker-integration:
    name: Worker integration
    runs-on: ubuntu-latest
    # Runs every test that needs a live service, not only the worker's -- the
    # job name predates the database tests and is kept because it is a required
    # check, and renaming it would block merges until branch protection caught
    # up.
    #
    # BullMQ is almost entirely Redis semantics, and the schema guarantees are
    # Postgres constraints. A fake would test the fake in both cases.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: rental
          POSTGRES_DB: rental_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental -d rental_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The suite asserts what the migrations built, so they have to have been
      # applied -- and applying them here also proves they run cleanly against a
      # database that has never seen them, which is the case that matters on a
      # newly provisioned box.
      - name: Apply migrations to the test database
        run: pnpm db:migrate:deploy
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: rental
          # Any value. The service uses trust auth, but @platform/config
          # requires a non-empty password so that a real environment cannot
          # start with a blank one.
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rental_test

      - name: Migrations are idempotent
        run: pnpm db:migrate:status
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: rental
          # Any value. The service uses trust auth, but @platform/config
          # requires a non-empty password so that a real environment cannot
          # start with a blank one.
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rental_test

      - name: Run service-backed tests
        run: pnpm test:integration
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: rental
          # Any value. The service uses trust auth, but @platform/config
          # requires a non-empty password so that a real environment cannot
          # start with a blank one.
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rental_test
          POSTGRES_TEST_DB: rental_test

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks-action derives its own commit range from the event, so this
          # scan is incremental regardless of depth. Full history is covered by
          # the separate secret-scan-history workflow. Depth is kept at 0 so the
          # action can resolve the range for a multi-commit pull request.
          fetch-depth: 0

      # GitHub push protection on this plan matches known provider patterns
      # only, so it would miss a database password or a custom signing secret.
      # This closes that gap for newly pushed commits.
      - name: Scan new commits for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Check dependency licences
        run: pnpm licences:check
