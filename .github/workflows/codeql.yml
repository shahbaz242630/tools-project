name: CodeQL

# Static analysis (BRD §12.2 SAST). Free on public repositories.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published rules find existing code rather than waiting
    # for the next pull request to touch it.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended adds lower-severity rules. Worth the extra time
          # on a payments codebase.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
