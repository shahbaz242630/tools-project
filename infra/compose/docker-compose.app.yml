# One environment's application stack: API, worker, database, queue broker.
#
# Deployed, not developed. `docker-compose.yml` at the repository root is the
# local development stack and the two must not be confused — this one runs
# published images by immutable tag, never builds, and publishes no ports.
#
# ADR 0009 puts staging and production on the same box, so everything here is
# parameterised by APP_ENV: project name, container names and volumes. Two
# copies of this stack coexist without colliding. The shared ingress that puts
# them on the public internet is docker-compose.ingress.yml.
#
# Bring it up through `node scripts/deploy.mjs`, which health-checks the result
# and rolls back if it fails. Running `docker compose up` by hand skips that.

# Distinct per environment, so `docker compose down` in staging cannot take
# production's containers with it.
name: rental-${APP_ENV:?set APP_ENV to staging or production}

x-logging: &logging
  # Container logs are unbounded by default. On a single box that is a disk-full
  # outage taking both environments with it, and it arrives weeks after deploy
  # when nobody is looking. 30 MB per service is enough for `scripts/logs.mjs`
  # to answer questions about a recent incident.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  # Runs to completion and exits, rather than serving anything. Behind a profile
  # so `docker compose up` ignores it entirely — `scripts/deploy.mjs` invokes it
  # with `compose run` before bringing the stack up, and aborts the deploy if it
  # fails.
  migrations:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/migrations:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    profiles: ['migrate']
    restart: 'no'
    logging: *logging

    environment:
      # Parts, not a URL. `prisma.config.ts` composes and percent-encodes it —
      # concatenating here would break on any password containing `/`, `@` or
      # `:`, which is most of what `openssl rand -base64` produces.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      # The same TLS mode the API uses, and required here for a reason worth
      # stating: the Prisma engine and node-postgres disagree about what an
      # absent `sslmode` means, so migrations can succeed against a database
      # the application then cannot open a connection to at all. Matching them
      # is what stops a green migration step from being mistaken for a working
      # deploy. ADR 0038.
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:?set POSTGRES_SSLMODE}

    networks:
      - internal

    depends_on:
      postgres:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  web:
    # The only service the ingress can reach. Everything the browser sees comes
    # from here; it calls the API server-side over the internal network.
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/web:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    # Predictable, because the ingress addresses it by name.
    container_name: rental-${APP_ENV}-web
    restart: unless-stopped
    logging: *logging

    environment:
      NODE_ENV: production
      # Read by Next's standalone server, which owns these rather than
      # @platform/config — see packages/config/src/web-env.ts.
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # The API as seen from this container: a name on the internal network,
      # never a public hostname. Deliberately not NEXT_PUBLIC_ — that prefix
      # would inline it into the browser bundle.
      API_BASE_URL: http://api:3000

      # --- Clerk (ADR 0015) ---
      # Public, and compiled into the browser bundle — that is what the
      # NEXT_PUBLIC_ prefix means and it is correct here.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}

      # Secret. Clerk's Next SDK needs it for the session handshake, so the
      # internet-facing service holds a key that can read the whole user
      # directory. That is a real cost of a hosted identity provider and it
      # stops here: the API below is given only the public JWT key.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY}

      # Secret. Verifies webhook signatures. Here rather than on the API
      # because the delivery lands on the edge and verification needs the raw
      # unparsed body, which exists only in this process.
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?set CLERK_WEBHOOK_SIGNING_SECRET}

      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /

    networks:
      - edge
      - internal

    # Deliberately no `depends_on`. The web app renders without the API — the
    # status page reports it as unreachable, which is the honest answer and the
    # useful one.
    #
    # Waiting for the API to be healthy would mean a database outage blocked
    # deploying or restarting the web app, exactly when you most want to put a
    # page in front of visitors. It also hid the web container's logs from a
    # failed deploy, because a never-healthy API meant it never started.

    # No `ports:`. The ingress is the only route in.

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    # Never `build:`. The artefact that reaches production is the one CI
    # published and nothing else — a box that can build is a box where the
    # running code and the tagged commit can silently diverge. See ADR 0012.
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/api:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    container_name: rental-${APP_ENV}-api
    restart: unless-stopped
    logging: *logging

    # Longer than the API's own SHUTDOWN_TIMEOUT_MS (10s), so the process
    # decides its own exit code rather than being SIGKILLed mid-teardown.
    # Docker's default is 10s, which is a dead heat with the timeout rather than
    # a margin. Asserted by scripts/lib/shutdown-budget.test.mjs.
    stop_grace_period: 15s

    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # 0.0.0.0, not localhost: binding the loopback interface inside a
      # container makes the service unreachable from the ingress.
      API_HOST: 0.0.0.0
      API_PORT: 3000

      # Structural, not secret — these name services on the internal network.
      # POSTGRES_PORT is set explicitly because @platform/config defaults it to
      # 5433 for the local stack, which is not the port inside this network.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Secret. `:?` rather than a default: an unset password would otherwise
      # start the stack with an empty credential and fail later, somewhere less
      # obvious than here.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}

      # How the database connection is protected (ADR 0038). Not optional here:
      # @platform/config requires it whenever NODE_ENV is production, which it
      # is two lines above, so an unset value stops the deploy at compose time
      # with a named error rather than at container start with a stack trace.
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:?set POSTGRES_SSLMODE}

      # --- Clerk (ADR 0015) ---
      # A *public* key, so not a secret — but still `:?` rather than a default,
      # because an API that starts without it authenticates nobody and only
      # discovers that on the first request.
      #
      # Supplying it is what makes verification networkless: the API never calls
      # Clerk, so a Clerk outage cannot hang an authenticated request. There is
      # deliberately no CLERK_SECRET_KEY here — that key can mint sessions and
      # read the whole user directory, and checking a signature needs neither.
      CLERK_JWT_PUBLIC_KEY: ${CLERK_JWT_PUBLIC_KEY:?set CLERK_JWT_PUBLIC_KEY}

      # Origins whose tokens this API accepts, as the `azp` claim. Without it a
      # token minted by any Clerk application on the instance verifies here.
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?set CLERK_AUTHORIZED_PARTIES}

      # --- Personal data encryption (ADR 0016) ---
      # Decrypts the street lines of stored addresses. `:?` because an API that
      # starts without it cannot read back an address anybody has saved, and
      # would discover that on somebody's profile page rather than at boot.
      #
      # Given to the API and to nothing else — notably not the worker, which has
      # no business being able to read a home address. Unlike the Clerk public
      # key above this is a real secret, and losing it is unrecoverable: the
      # ciphertext in `addresses` is all there is.
      PERSONAL_DATA_ENCRYPTION_KEY: ${PERSONAL_DATA_ENCRYPTION_KEY:?set PERSONAL_DATA_ENCRYPTION_KEY}

    # Internal only. The API is not on `edge` and is therefore unreachable from
    # the ingress and from the internet: the browser never calls it directly,
    # the web app calls it server-side. When a browser-facing endpoint is
    # genuinely needed, add a route through the ingress deliberately rather than
    # leaving the whole surface exposed by default.
    networks:
      - internal

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # No `ports:`. Publishing 3000 here would expose plain HTTP on the box's
    # public interface and bypass the ingress entirely.

    security_opt:
      - no-new-privileges:true
    # The application writes nothing to disk; logs go to stdout. A writable
    # root filesystem is an attacker's foothold for no operational benefit.
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # ADR 0009 records "a runaway process can affect both environments" as
          # the accepted cost of one box. A ceiling turns that from an outage
          # into a restart of the container that misbehaved.
          memory: 512M

  worker:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/worker:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA}
    container_name: rental-${APP_ENV}-worker
    restart: unless-stopped
    logging: *logging

    # A worker mid-job has to finish it — an interrupted job is re-delivered,
    # which for anything non-idempotent is worse than waiting — so its
    # SHUTDOWN_TIMEOUT_MS is 30s and this must exceed it. Under Docker's unset,
    # therefore 10s, default the worker was SIGKILLed at 10s every single time
    # and its force-exit had never once fired. Asserted by
    # scripts/lib/shutdown-budget.test.mjs.
    stop_grace_period: 45s

    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      # ADR 0038, and required for the same reason as on the API above.
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:?set POSTGRES_SSLMODE}

    # Not on `edge`. The worker serves no traffic and has no reason to be
    # addressable from the ingress.
    networks:
      - internal

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M

  postgres:
    # Pinned to the same image as local development and CI. PostGIS is a hard
    # dependency (BRD §4.2), not an extension we install later.
    image: postgis/postgis:17-3.5
    container_name: rental-${APP_ENV}-postgres
    restart: unless-stopped
    logging: *logging

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      # Matches local development, so index ordering is the same everywhere.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'

    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The same initialisation SQL as local development. Runs once, only when
      # the data volume is empty. Requires the repository to be present on the
      # box — see README.md.
      - ../postgres/init:/docker-entrypoint-initdb.d:ro

    # No `ports:`. An exposed Postgres on a public IP is found by scanners in
    # minutes. Reach it with `docker compose exec`, or over an SSH tunnel.
    networks:
      - internal

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: rental-${APP_ENV}-redis
    restart: unless-stopped
    logging: *logging

    # noeviction, as in every other environment. Under an eviction policy Redis
    # silently drops job data when memory fills, losing booking expiry and
    # payout release jobs (BRD §8.6, §8.9). maxmemory is set below the container
    # limit so Redis refuses writes before the kernel kills it — a rejected
    # write is an error we can see, an OOM kill is a job that vanished.
    command: >
      redis-server
      --maxmemory 192mb
      --maxmemory-policy noeviction
      --appendonly yes

    volumes:
      - redis-data:/data

    networks:
      - internal

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  # Shared with the ingress and with the other environment's API. Created once
  # when the box is provisioned, not by this file, because a network owned by
  # one compose project disappears when that project is torn down.
  edge:
    external: true
    name: rental-edge

  # Per environment. Staging's API cannot reach production's database.
  internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
