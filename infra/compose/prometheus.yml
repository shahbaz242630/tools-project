# What Prometheus scrapes (slice H1).
#
# The API only. The worker has no HTTP server, and the web app is Next.js —
# instrumenting either is its own decision rather than something to assume here.
# `scripts/verify-stack.mjs` and the Deploy rehearsal both check the API is the
# thing answering.

global:
  # 15s is the usual default and is a real trade: it is the resolution of every
  # graph and the granularity of every alert. Slower saves disk on a small box;
  # faster mostly buys noise on a service with our traffic.
  scrape_interval: 15s
  evaluation_interval: 15s
  # **Expanded by Prometheus, not by compose** (slice H5). Compose substitutes
  # variables in the compose file; a mounted config file is just bytes to it. So
  # this needs `--enable-feature=expand-external-labels` on the command *and*
  # `APP_ENV` in the container's environment — both are set in
  # `docker-compose.observability.yml`, and either one alone leaves this empty.
  #
  # It also cannot be checked by querying a series: external labels are added
  # when data leaves Prometheus, so `/api/v1/status/config` is the only place it
  # shows.
  external_labels:
    environment: '${APP_ENV}'

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      # The compose service name, resolved on the internal network. Not a
      # published port: there is none, and there must not be one.
      - targets: ['api:3000']
        labels:
          service: api

  # The worker, from slice H6. Until then it was the one running service nothing
  # could see: `recordQueueJob` had sat unused in the `Metrics` port since H1 and
  # no number about the queue outlived a deploy. 4.7b put a schedule in it, which
  # is what made that matter — "the sweep ran" and "the sweep has not run since
  # Tuesday" looked identical from outside.
  #
  # 9464 rather than 3000: the conventional exporter port, and a distinct number
  # keeps this file readable beside `api:3000`. Not a published port — the worker
  # joins `internal` only, and there must not be one.
  #
  # **`up{service="worker"} == 0` is now a real signal.** The worker has no
  # inbound traffic of its own, so a failure to scrape means the process is gone
  # or wedged — which is the second alert rule this project should write, after
  # the geocoder.
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9464']
        labels:
          service: worker

  # Prometheus watching itself. Cheap, and it is the only thing that can tell
  # you the scraper stopped — a dashboard that goes flat looks identical to a
  # platform with no traffic.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
